name: Daily Hugging Face Papers

on:
  schedule:
    - cron: "15 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

concurrency:
  group: daily-hugging-face-papers
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: python -m pip install -e .

      - name: Check required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing repository secret OPENAI_API_KEY"
            exit 1
          fi
          if [ -z "$OPENAI_MODEL" ]; then
            echo "::error::Missing repository secret OPENAI_MODEL"
            exit 1
          fi

      - name: Fetch and generate daily papers
        env:
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python scripts/fetch_latest.py --proxy "" --skip-site-build

      - name: Persist resumable daily state
        if: ${{ always() }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add data/daily data/tags
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update daily papers $(date +%F)"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Verify latest daily state
        run: |
          latest_file="$(find data/daily -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)"
          if [ -z "$latest_file" ]; then
            echo "::error::No daily data file was found"
            exit 1
          fi
          jq -e '
            .status == "complete"
            and .paper_count > 0
            and .paper_count == (.papers | length)
          ' "$latest_file" >/dev/null
          echo "Verified $latest_file"

      - name: Build the static site
        run: python -m hf_daily build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
